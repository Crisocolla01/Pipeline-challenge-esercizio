AWSTemplateFormatVersion: "2010-09-09"

Description: >
  GitHub Actions lab stack using OIDC (no long-lived access keys).
  Assumes the GitHub OIDC Provider already exists in the AWS account.
  Creates staging & production Lambda functions (with Function URLs), plus an IAM Role locked
  to a single GitHub repo with permissions scoped to update only those functions.

Parameters:
  GitHubRepository:
    Type: String
    Default: "GITHUB_OWNER_NAME/GITHUB_REPO_NAME"
    Description: GitHub repository in GITHUB_OWNER_NAME/GITHUB_REPO_NAME format used to lock the OIDC trust policy.

Resources:
  # ------------------------------------------------------------
  # Execution Role for Lambda (basic logging)
  # ------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-LambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # ------------------------------------------------------------
  # Lambda: Staging
  # ------------------------------------------------------------
  LambdaFunctionStaging:
    Type: AWS::Lambda::Function
    Properties:
      Description: The 'staging' environment for the sample application.
      FunctionName: !Sub ${AWS::StackName}-staging
      Runtime: python3.10
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          ENVIRONMENT: STAGING
          VERSION: 0
          PLATFORM: CloudFormation
          BUILD_NUMBER: 0
      Code:
        ZipFile: |
          def handler(event, context):
              import os
              environment = os.environ['ENVIRONMENT']
              html_response = f"""
              <!DOCTYPE html>
              <html>
              <head>
                  <title>Welcome - {environment}</title>
                  <style>
                      body {{
                          font-family: Arial, sans-serif;
                          line-height: 1.6;
                          max-width: 800px;
                          margin: 0 auto;
                      }}
                      h1, h2 {{
                          color: #333;
                          border-bottom: 1px solid #ccc;
                      }}
                      p {{
                          margin-bottom: 16px;
                      }}
                  </style>
              </head>
              <body>
                  <h1>Welcome!</h1>
                  <h2>This is the <b>{environment}</b> environment.</h2>
                  <p>Get ready to learn more about CI/CD and several amazing tools that simplify testing, building, and deploying software.</p>
                  <p>This welcome page is just the beginning. Take the next step by deploying the code for the application.</p>
              </body>
              </html>
              """
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'text/html'},
                  'body': html_response
              }

  LambdaUrlStaging:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref LambdaFunctionStaging
      AuthType: NONE

  LambdaUrlPermissionStaging:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunctionStaging
      Principal: "*"
      Action: "lambda:InvokeFunctionUrl"
      FunctionUrlAuthType: NONE

  # ------------------------------------------------------------
  # Lambda: Production
  # ------------------------------------------------------------
  LambdaFunctionProduction:
    Type: AWS::Lambda::Function
    Properties:
      Description: The 'production' environment for the sample application.
      FunctionName: !Sub ${AWS::StackName}-production
      Runtime: python3.10
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          ENVIRONMENT: PRODUCTION
          VERSION: 0
          PLATFORM: CloudFormation
          BUILD_NUMBER: 0
      Code:
        ZipFile: |
          def handler(event, context):
              import os
              environment = os.environ['ENVIRONMENT']
              html_response = f"""
              <!DOCTYPE html>
              <html>
              <head>
                  <title>Welcome - {environment}</title>
                  <style>
                      body {{
                          font-family: Arial, sans-serif;
                          line-height: 1.6;
                          max-width: 800px;
                          margin: 0 auto;
                      }}
                      h1, h2 {{
                          color: #333;
                          border-bottom: 1px solid #ccc;
                      }}
                      p {{
                          margin-bottom: 16px;
                      }}
                  </style>
              </head>
              <body>
                  <h1>Welcome!</h1>
                  <h2>This is the <b>{environment}</b> environment.</h2>
                  <p>Get ready to learn more about CI/CD and several amazing tools that simplify testing, building, and deploying software.</p>
                  <p>This welcome page is just the beginning. Take the next step by deploying the code for the application.</p>
              </body>
              </html>
              """
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'text/html'},
                  'body': html_response
              }

  LambdaUrlProduction:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref LambdaFunctionProduction
      AuthType: NONE

  LambdaUrlPermissionProduction:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunctionProduction
      Principal: "*"
      Action: "lambda:InvokeFunctionUrl"
      FunctionUrlAuthType: NONE

  # ------------------------------------------------------------
  # Role assumed by GitHub Actions via OIDC, locked to ONE repo
  # ------------------------------------------------------------
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-GitHubActionsRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowGitHubActionsAssumeRoleWithOidc
            Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: "sts.amazonaws.com"
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:*"

  # Scoped permissions: update ONLY the two functions created by this stack
  GitHubActionsRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-GitHubActions-LambdaUpdate
      Roles:
        - !Ref GitHubActionsRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UpdateOnlyTheseFunctions
            Effect: Allow
            Action:
              - lambda:UpdateFunctionCode
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionConfiguration
              - lambda:GetFunction
              - lambda:PublishVersion
              - lambda:CreateAlias
              - lambda:UpdateAlias
              - lambda:GetAlias
              - lambda:ListAliases
              - lambda:ListVersionsByFunction
            Resource:
              - !GetAtt LambdaFunctionProduction.Arn
              - !GetAtt LambdaFunctionStaging.Arn

          - Sid: ListFunctionsReadOnly
            Effect: Allow
            Action:
              - lambda:ListFunctions
            Resource: "*"

Outputs:
  StagingFunctionName:
    Description: The name of the Lambda function for the staging environment. Use this for STAGING_FUNCTION_NAME.
    Value: !Ref LambdaFunctionStaging

  StagingURL:
    Description: The URL for the staging environment. Use this for STAGING_URL.
    Value: !GetAtt LambdaUrlStaging.FunctionUrl

  ProductionFunctionName:
    Description: The name of the Lambda function for the production environment. Use this for PRODUCTION_FUNCTION_NAME.
    Value: !Ref LambdaFunctionProduction

  ProductionURL:
    Description: The URL for the production environment. Use this for PRODUCTION_URL.
    Value: !GetAtt LambdaUrlProduction.FunctionUrl

  AwsDefaultRegion:
    Description: The AWS region where the stack is deployed. Use this for AWS_DEFAULT_REGION.
    Value: !Ref AWS::Region

  GitHubRepositoryLocked:
    Description: The GitHub repository (OWNER/REPO) allowed to assume the role via OIDC.
    Value: !Ref GitHubRepository

  GitHubActionsRoleArn:
    Description: Role ARN to assume from GitHub Actions using OIDC.
    Value: !GetAtt GitHubActionsRole.Arn

  GitHubActionsRoleConsoleURL:
    Description: Direct link to view the IAM Role in the AWS console.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/iam/home?region=${AWS::Region}#/roles/details/${GitHubActionsRole}"

  StagingLambdaConsoleURL:
    Description: Direct link to the staging Lambda function in the AWS Lambda console.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/lambda/home?region=${AWS::Region}#/functions/${LambdaFunctionStaging}"

  ProductionLambdaConsoleURL:
    Description: Direct link to the production Lambda function in the AWS Lambda console.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/lambda/home?region=${AWS::Region}#/functions/${LambdaFunctionProduction}"
